[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-fund-analyzer"
version = "0.1.0"
description = "Local evidence-grounded analyzer for Indian mutual funds, PMS strategies, and AIFs"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.48,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "plotly>=6,<7",
  "PyMuPDF>=1.25,<2",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5,<7",
  "html5lib>=1.1,<2",
  "rapidfuzz>=3.10,<4",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "respx>=0.22,<1"]

[tool.setuptools.packages.find]
include = ["fund_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
